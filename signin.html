<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Blood Donation System</title>
    <link rel="stylesheet" href="style/navbars.css">
    <link rel="stylesheet" href="style/form.css">
    <link rel="stylesheet" href="style/pop-up.css">
    <link rel="stylesheet" href="style/signin.css">
</head>

<body>
    <div class="container">
        <div id="header"></div>
        <main>

            <div class="form-container">

                <form id="signInForm">

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>

                    <label for="password">Password</label>

                    <section class="password-field">

                        <input type="password" id="password" placeholder="Enter your password" required>

                        <button type="button" class="show-btn" onclick="togglePassword()">
                            Show
                        </button>

                    </section>

                    <button type="submit">Sign In</button>

                </form>

                <p class="forgot-password">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </p>

                <p>
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </div>

        </main>

        <div id="footer"></div>
    </div>

    <!-- Success Popup -->

    <div id="popup" class="popup">

        <div class="popup-box">

            <h2 id="popupTitle">Success</h2>

            <p id="popupMessage"></p>

            <button id="popupBtn">OK</button>

        </div>

    </div>

    <!-- Confirm Popup -->

    <div id="confirmPopup" class="popup">

        <div class="popup-box">

            <h2 id="confirmTitle">Confirm</h2>

            <p id="confirmMessage"></p>

            <div class="popup-buttons">

                <button id="confirmYes">Yes</button>

                <button id="confirmNo">Cancel</button>

            </div>

        </div>

    </div>

<script src="javaScript/header.js"></script>
    <script src="javaScript/popup.js"></script>   
    <script src="javaScript/signin.js"></script>
    <script src="javaScript/footer.js"></script>
</body>

</html>
