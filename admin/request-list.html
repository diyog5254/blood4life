<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/navbars.css">
    <link rel="stylesheet" href="../style/admin-dashboard.css">
    <link rel="stylesheet" href="../style/dashboardPage.css">
    <link rel="stylesheet" href="../style/pop-up.css">
</head>

<body>
    <div id="header"></div>

    <main class="admin-container">

        <h1>Blood Requests</h1>

        <div class="request-controls">

            <input type="text" id="searchInput" placeholder="Search Patient Name">

            <select id="bloodFilter">

                <option value="All">All Blood Groups</option>

                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>

        </div>

        <table class="donor-table">

            <thead>

                <tr>
                    <th>Patient</th>
                    <th>Blood</th>
                    <th>Hospital</th>
                    <th>Contact</th>
                    <th>Units</th>
                    <th>Emergency</th>
                    <th>Request Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="requestTableBody">

            </tbody>

        </table>

    </main>

    <div id="footer"></div>
    <!-- Success Popup -->

    <div id="popup" class="popup">

        <div class="popup-box">

            <h2 id="popupTitle">Success</h2>

            <p id="popupMessage"></p>

            <button id="popupBtn">OK</button>

        </div>

    </div>

    <!-- Confirm Popup -->

    <div id="confirmPopup" class="popup">

        <div class="popup-box">

            <h2 id="confirmTitle">Confirm</h2>

            <p id="confirmMessage"></p>

            <div class="popup-buttons">

                <button id="confirmYes">Yes</button>

                <button id="confirmNo">Cancel</button>

            </div>

        </div>

    </div>
    <script src="../javaScript/header.js"></script>
    <script src="../javaScript/popup.js"></script>
    <script src="../javaScript/request-list.js"></script>
    <script src="../javaScript/footer.js"></script>
</body>

</html>
