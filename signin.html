<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Blood Donation System</title>
    <link rel="stylesheet" href="style/navbars.css">
    <link rel="stylesheet" href="style/form.css">
    <link rel="stylesheet" href="style/pop-up.css">
    <link rel="stylesheet" href="style/signin.css">
</head>

<body>
    <div id="header"></div>
    <main>

        <div class="form-container">

            <form id="signInForm">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>

                <section class="password-field">

                    <input type="password" id="password" placeholder="Enter your password" required>

                    <button type="button" class="show-btn" onclick="togglePassword()">
                        Show
                    </button>

                </section>

                <button type="submit">Sign In</button>

            </form>

            <p class="forgot-password">
                <a href="#" id="forgotPassword">Forgot Password?</a>
            </p>

            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </main>

    <div id="footer"></div>

    <div id="popup-container"></div>

    <script src="javaScript/header.js"></script>
    <script src="javaScript/popup.js"></script>
    <script src="javaScript/signin.js"></script>
    <script src="javaScript/footer.js"></script>
</body>

</html>
