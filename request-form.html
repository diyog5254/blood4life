<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Request</title>

    <link rel="stylesheet" href="style/navbars.css">
    <link rel="stylesheet" href="style/form.css">
    <link rel="stylesheet" href="style/request-form.css">
    <link rel="stylesheet" href="style/pop-up.css">

</head>

<body>
    <div id="header"></div>

    <!-- Main -->

    <main class="request-section">

        <div class="form-container">

            <h2>Blood Request Form</h2>

            <form id="requestForm">

                <label>Patient Name</label>
                <input type="text" id="patientName" required>

                <label>Email</label>
                <input type="email" id="email" readonly>

                <label>Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>

                <label>Hospital Name</label>
                <input type="text" id="hospital" required>

                <label>Contact Number</label>
                <input type="tel" id="contact" required>

                <label>Units Required</label>
                <input type="number" id="units" min="1" required>

                <label>Emergency Level</label>
                <select id="emergency" required>
                    <option value="">Select</option>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>

                <label>Reason</label>
                <textarea id="reason" rows="5" required></textarea>

                <div class="button-group">
                    <button type="submit">Submit Request</button>
                    <button type="reset">Reset</button>
                </div>

            </form>

        </div>

    </main>

    <div id="footer"></div>

    <div id="popup-container"></div>

    <script src="javaScript/header.js"></script>
    <script src="javaScript/popup.js"></script>
    <script src="javaScript/request-form.js"></script>
    <script src="javaScript/footer.js"></script>


</body>

</html>
