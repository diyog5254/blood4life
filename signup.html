<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="style/navbars.css">
    <link rel="stylesheet" href="style/form.css">
    <link rel="stylesheet" href="style/pop-up.css">
    <link rel="stylesheet" href="style/signup.css">
</head>

<body>

    <div class="container">
        <div id="header"></div>

        <main class="signup-box">

            <div class="form-container">

                <h2>Create Account</h2>

                <form id="signupForm">

                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" required>

                    <label for="password">Password</label>

                    <div class="password-container">

                        <input type="password" id="password" required>

                        <div class="show-password">

                            <input type="checkbox" id="showPassword" onchange="togglePassword(this,'password')">

                            <label for="showPassword">Show</label>

                        </div>

                    </div>

                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-container">

                        <input type="password" id="confirmPassword" required>

                        <div class="show-password">

                            <input type="checkbox" id="showConfirmPassword"
                                onchange="togglePassword(this,'confirmPassword')">

                            <label for="showConfirmPassword">Show</label>

                        </div>

                    </div>

                    <div class="button-group">

                        <button type="submit">Create Account</button>
                        <button type="reset">Reset</button>

                    </div>

                    <p id="message"></p>

                </form>

                <p class="signin-text">
                    Already have an account?
                    <a href="signin.html">Sign In</a>
                </p>

            </div>

        </main>

        <div id="footer"></div>
    </div>

    <!-- Success Popup -->

    <div id="popup" class="popup">

        <div class="popup-box">

            <h2 id="popupTitle">Success</h2>

            <p id="popupMessage"></p>

            <button id="popupBtn">OK</button>

        </div>

    </div>
    <!-- Confirm Popup -->

    <div id="confirmPopup" class="popup">

        <div class="popup-box">

            <h2 id="confirmTitle">Confirm</h2>

            <p id="confirmMessage"></p>

            <div class="popup-buttons">

                <button id="confirmYes">Yes</button>

                <button id="confirmNo">Cancel</button>

            </div>

        </div>

    </div>
<script src="javaScript/header.js"></script>
    <script src="javaScript/popup.js"></script>
    <script src="javaScript/signup.js"></script>
    <script src="javaScript/footer.js"></script>
    

</body>

</html>
