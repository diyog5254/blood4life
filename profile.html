<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="style/navbars.css">
    <link rel="stylesheet" href="style/profile.css">
    <link rel="stylesheet" href="style/pop-up.css">
</head>

<body>
    <div id="header"></div>
    <!-- Profile -->
    <main class="profile-container">

        <h1>My Profile</h1>

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-image">
                    👤
                </div>

                <div>

                    <h2 id="profileName"></h2>

                    <p id="profileEmail"></p>

                    <span id="profileRole"></span>

                </div>

            </div>

            <div class="profile-details">

                <div class="detail-box">

                    <h3>Personal Information</h3>

                    <p><strong>Phone:</strong> <span id="profilePhone"></span></p>

                    <p><strong>Address:</strong> <span id="profileAddress"></span></p>

                    <p><strong>Gender:</strong> <span id="profileGender"></span></p>

                    <p><strong>Age:</strong> <span id="profileAge"></span></p>

                </div>

                <div class="detail-box">

                    <h3>Donation Information</h3>

                    <p><strong>Blood Group:</strong> <span id="profileBlood"></span></p>

                    <p><strong>Weight:</strong> <span id="profileWeight"></span></p>

                    <p><strong>Last Donation:</strong> <span id="profileDonation"></span></p>

                    <p><strong>Status:</strong> <span id="profileStatus"></span></p>

                </div>

            </div>

            <div class="profile-buttons">

                <a href="#" id="dashboardBtn">Dashboard</a>

                <a href="#" id="editProfileBtn">Edit Profile</a>

                <!-- <button id="logoutBtn">Logout</button> -->

            </div>

        </div>

    </main>

    <div id="footer"></div>

    <div id="popup-container"></div>

    <script src="javaScript/header.js"></script>
    <script src="javaScript/profile.js"></script>
    <script src="javaScript/popup.js"></script>
    <script src="javaScript/footer.js"></script>
</body>

</html>
