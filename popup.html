<!-- Success Popup -->

<div id="popup" class="popup">

    <div class="popup-box">
        <div id="popupIcon" class="popup-icon"></div>
        <h3 id="popupTitle"></h3>

        <p id="popupMessage"></p>

        <button id="popupBtn">
            OK
        </button>

    </div>

</div>

<!-- Confirm Popup -->

<div id="confirmPopup" class="popup">

    <div class="popup-box">
        <div class="popup-icon warning">?</div>
        <h3 id="confirmTitle"></h3>

        <p id="confirmMessage"></p>

        <button id="confirmYes">
            Yes
        </button>

        <button id="confirmNo">
            No
        </button>

    </div>

</div>
//loading
<div id="loadingPopup" class="popup">

    <div class="popup-box">

        <div class="loader"></div>

        <h3>Please Wait...</h3>

        <p>Processing your request.</p>

    </div>

</div>
