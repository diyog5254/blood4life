<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/navbars.css">
    <link rel="stylesheet" href="../style/adminDashboard.css">
    <link rel="stylesheet" href="../style/dashboardPage.css">
    <link rel="stylesheet" href="../style/pop-up.css">
</head>

<body>
    <div id="header"></div>

    <main class="admin-container">

        <h1>Admin Dashboard</h1>

        <div class="stats-section">

            <div class="stat-card">

                <h3>Total Users</h3>

                <h2 id="totalUsers">0</h2>

            </div>

            <div class="stat-card">
                <h3>Total Donors</h3>
                <h1 id="totalDonors">0</h1>
            </div>

            <div class="stat-card">
                <h3>Blood Requests</h3>
                <h1 id="totalRequests">0</h1>
            </div>

            <div class="stat-card">
                <h3>Pending Requests</h3>
                <h1 id="pendingRequests">0</h1>
            </div>

        </div>

        //RECENT DONORS

        <div class="table-section">

            <h2>Recent Donors</h2>

            <table class="donor-table">

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Blood Group</th>
                        <th>Phone</th>
                    </tr>

                </thead>


                <tbody id="recentDonorTable">

                </tbody>


            </table>

        </div>

        <div class="admin-actions">

            <a href="donorList.html" class="action-btn">View Donors</a>

            <a href="requestList.html" class="action-btn">View Requests</a>

            <a href="../home.html" class="action-btn">Home</a>

        </div>

    </main>
    <div id="footer"></div>
    
    <div id="popup-container"></div>

    <script src="../javaScript/header.js"></script>
    <script src="../javaScript/footer.js"></script>
    <script src="../javaScript/adminDashboard.js"></script>
    <script src="../javaScript/popup.js"></script>
    
</body>

</html>
