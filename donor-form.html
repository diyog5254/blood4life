<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/navbars.css">
    <link rel="stylesheet" href="style/form.css">
    <link rel="stylesheet" href="style/donor-form.css">
    <link rel="stylesheet" href="style/pop-up.css">
</head>

<body>
    <div id="header"></div>
    <div class="form-container">
        <h2>Donor Registration Form </h2>

        <form action="#" method="POST" id="donorForm">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="full name">Full Name</label>
                <input type="text" id="name" name="name" readonly>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" readonly>


                <label for="dob">Date of Birth (Must be 18+)</label>
                <input type="date" id="dob" name="dob">

                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" name="weight" min="45" placeholder="Enter your weight" required>

                <label for="gender">Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>



                <label for="blood group">Blood Group</label>
                <select id="blood" name="blood" required>
                    <option value="">Select</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>

                <label for="previousDonation">
                    Previous Donation Date
                </label>

                <input type="date" id="previousDonation" name="previousDonation">

            </fieldset>

            <fieldset>
                <legend>Contact Information</legend>


                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="+977-XXXXXXXXXX" required>


                <label for="whatsapp number">WhatsApp Number</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="+977-XXXXXXXXXX">


                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>

            </fieldset>

            <div class="declaration">

                <label>

                    <input type="checkbox" id="agree" required>

                    I confirm that all the information provided is correct.

                </label>

            </div>

            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

    <div id="footer"></div>
    <!-- Success Popup -->

    <div id="popup" class="popup">

        <div class="popup-box">

            <h2 id="popupTitle">Success</h2>

            <p id="popupMessage"></p>

            <button id="popupBtn">OK</button>

        </div>

    </div>

    <!-- Confirm Popup -->

    <div id="confirmPopup" class="popup">

        <div class="popup-box">

            <h2 id="confirmTitle">Confirm</h2>

            <p id="confirmMessage"></p>

            <div class="popup-buttons">

                <button id="confirmYes">Yes</button>

                <button id="confirmNo">Cancel</button>

            </div>

        </div>

    </div>
    <script src="javaScript/header.js"></script>
    <script src="javaScript/popup.js"></script>
    <script src="javaScript/donorForm.js"></script>
    <script src="javaScript/footer.js"></script>

</body>

</html>
